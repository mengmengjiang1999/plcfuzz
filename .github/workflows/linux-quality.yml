name: Linux quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_JOBS: "2"
      MATIEC_BUILD_JOBS: "1"
      PLCFUZZ_TOOLCHAIN_BUILD_JOBS: "1"
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential clang cmake flex git \
            libtool lld llvm-dev pkg-config python3 ripgrep

      - name: Verify repository inputs
        shell: bash
        run: |
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo "Submodule checkout does not match the recorded revision." >&2
            exit 1
          fi
          bash scripts/check_ci_workflow.sh
          ./scripts/verify_preserved_artifacts.sh

      - name: Compute fixed toolchain cache keys
        id: toolchain-cache-keys
        shell: bash
        run: |
          matiec_revision=$(git rev-parse HEAD:third_party/matiec)
          cxx_version=$(c++ -dumpfullversion -dumpversion)
          clang_version=$(clang -dumpversion)
          echo "matiec=${matiec_revision}-cxx-${cxx_version}-cache-v1" >> "$GITHUB_OUTPUT"
          echo "aflpp=v5.03c-clang-${clang_version}-cache-v1" >> "$GITHUB_OUTPUT"

      - name: Restore MatIEC build cache
        id: cache-matiec
        uses: actions/cache@v5
        with:
          path: third_party/matiec
          key: linux-toolchain-matiec-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-cache-keys.outputs.matiec }}

      - name: Build and test MatIEC
        env:
          MATIEC_USE_PREBUILT: ${{ steps.cache-matiec.outputs.cache-hit }}
        run: MATIEC_RUN_TESTS=1 ./scripts/plcfuzz setup

      - name: Run project checks
        run: |
          ./scripts/check_project_wording.sh
          ./scripts/check_source_layout.sh
          ./scripts/plcfuzz test unit
          python3 scripts/check_testcase_manifest.py --verify-compiler
          ./scripts/plcfuzz test testcases

      - name: Build normal runtime and mapping
        run: |
          ./scripts/plcfuzz build plc testcases/race_test_success.st
          ./scripts/plcfuzz build runtime
          ./scripts/plcfuzz build analyze
          test -x openplc
          test -s plc_variables_mapping.csv

      - name: Build custom mutator
        run: |
          ./scripts/plcfuzz build mutator
          test -f build/mutator/libplc_mutator.so

      - name: Build diagnostic targets
        run: |
          ./scripts/plcfuzz diagnostics all
          test -x build/diagnostics/runtime/openplc_diagnostic
          find build/diagnostics/mutator -maxdepth 1 -type f -name 'libplc_mutator.*' -print -quit | grep -q .

      - name: Restore AFL++ build cache
        id: cache-aflpp
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/AFLplusplus
          key: linux-toolchain-aflpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-cache-keys.outputs.aflpp }}

      - name: Build pinned AFL++ compiler
        shell: bash
        run: |
          if [[ "${{ steps.cache-aflpp.outputs.cache-hit }}" != true ]]; then
            git clone --branch v5.03c --depth 1 \
              https://github.com/AFLplusplus/AFLplusplus.git \
              "$RUNNER_TEMP/AFLplusplus"
            make -C "$RUNNER_TEMP/AFLplusplus" source-only -j"$PLCFUZZ_TOOLCHAIN_BUILD_JOBS"
          fi
          test -x "$RUNNER_TEMP/AFLplusplus/afl-clang-fast++"
          "$RUNNER_TEMP/AFLplusplus/afl-clang-fast++" --version

      - name: Build instrumented runtime
        run: |
          PLCFUZZ_INSTRUMENTED_CXX="$RUNNER_TEMP/AFLplusplus/afl-clang-fast++" ./scripts/plcfuzz build instrumented
          test -x openplc_fuzz
