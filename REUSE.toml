version = 1
SPDX-PackageName = "PLCFuzz"
SPDX-PackageSupplier = "Organization: PLCFuzz contributors"
SPDX-PackageDownloadLocation = "https://github.com/mengmengjiang1999/plcfuzz"

[[annotations]]
path = [".clang-format", ".github/workflows/*.yml", ".gitignore", ".gitmodules", "CMakeLists.txt", "CONTRIBUTING.md", "Dockerfile.repro", "Makefile", "README.md", "REPRODUCIBILITY.md", "REUSE.toml", "THIRD_PARTY_NOTICES.md", "build_scripts/*.sh", "build_scripts/README.md", "buildscript.sh", "buildscript_new.sh", "count_code.sh", "docs/**/*.md", "fuzz_config/CMakeLists.txt", "fuzz_config/*.cpp", "fuzz_config/*.h", "fuzz_config/plc.dict", "fuzz_config/plc.grammar", "include/basic_buffer_history.h", "include/basic_input_block.h", "include/buffer_history.h", "include/input_data_simulator.h", "include/plc_input_apply.h", "include/plc_input_block.h", "include/plc_input_format.h", "include/plc_input_simulator.h", "include/runtime_timing.h", "openspec/**/.openspec.yaml", "openspec/**/*.md", "openspec/**/*.yaml", "run.sh", "run_fuzz_all.sh", "run_single_fuzz_example.sh", "runfuzz.sh", "scripts/*.py", "scripts/*.sh", "src/buffer_history.cpp", "src/communication_compat.cpp", "src/plc_input_simulator.cpp", "src/runtime_globals.cpp", "static_analyse/*.md", "static_analyse/*.py", "tests/*.cpp", "tests/*.py", "tests/fixtures/*.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 PLCFuzz contributors"
SPDX-License-Identifier = "GPL-3.0-only"
