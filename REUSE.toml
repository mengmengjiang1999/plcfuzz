version = 1
SPDX-PackageName = "PLC Robustness Lab"
SPDX-PackageSupplier = "Organization: PLC Robustness Lab contributors"
SPDX-PackageDownloadLocation = "https://github.com/mengmengjiang1999/plcfuzz"

[[annotations]]
path = [".clang-format", ".dockerignore", ".github/workflows/*.yml", ".gitignore", ".gitmodules", "CMakeLists.txt", "CONTRIBUTING.md", "Dockerfile.repro", "Makefile", "README.md", "REPRODUCIBILITY.md", "REUSE.toml", "THIRD_PARTY_NOTICES.md", "build_scripts/*.sh", "build_scripts/README.md", "buildscript.sh", "buildscript_new.sh", "count_code.sh", "docs/**/*.md", "input_generation/CMakeLists.txt", "input_generation/*.cpp", "input_generation/*.h", "input_generation/plc.dict", "input_generation/plc.grammar", "include/basic_buffer_history.h", "include/basic_input_block.h", "include/buffer_history.h", "include/input_data_simulator.h", "include/plc_input_apply.h", "include/plc_input_block.h", "include/plc_input_format.h", "include/plc_input_simulator.h", "include/plc_runtime_address.h", "include/pthread_mutex_guard.h", "include/runtime_buffer_storage.h", "include/runtime_timing.h", "openspec/**/.openspec.yaml", "openspec/**/*.md", "openspec/**/*.yaml", "run.sh", "run_fuzz_all.sh", "run_single_fuzz_example.sh", "runfuzz.sh", "scripts/*.py", "scripts/*.sh", "scripts/plc-lab", "scripts/plcfuzz", "src/buffer_history.cpp", "src/communication_compat.cpp", "src/plc_input_simulator.cpp", "src/runtime_globals.cpp", "static_analyse/*.md", "static_analyse/*.py", "testcases/*.md", "testcases/*.st", "testcases/LD-test/*.md", "testcases/LD-test/SOURCE.tsv", "testcases/archive/**/*.md", "testcases/archive/incompatible-matiec/ST-test/c_demo.st", "testcases/archive/incompatible-matiec/auto_race/*.st", "testcases/archive/incompatible-matiec/race_bug_tests/*.st", "testcases/archive/incompatible-matiec/test.st", "testcases/generated_concurrency/*.st", "testcases/manifest.tsv", "testcases/matiec/**/*.st", "testcases/no_concurrency_candidate/*.st", "testcases/provenance.tsv", "testcases/concurrency_candidates/*.st", "tests/*.cpp", "tests/*.py", "tests/fixtures/*.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 PLC Robustness Lab contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["evaluation/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 PLC Robustness Lab contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["coverage/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 PLC Robustness Lab contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["benchmarks/**/*.json", "benchmarks/replay/*.txt", "testcases/benchmarks/*.st"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 PLC Robustness Lab contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["testcases/LD-test/*.ld", "testcases/archive/incompatible-matiec/ctc_osr.st", "testcases/archive/incompatible-matiec/hello_ld_convert.st"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2004-2021 Jonathan Westhues and LDmicro contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
